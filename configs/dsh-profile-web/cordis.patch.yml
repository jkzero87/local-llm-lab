# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        timeZone: America/Bogota
        refreshIntervalMs: 900000
# free-search engine settings, ported by hand from the 0.1.5 settings.yaml
# `free-search:` section (that id no longer exists, so the one-time import
# skipped it). Patch semantics replace the whole row config: keep all keys.
- id: web-search-free
  config:
    provider: ddg
    region: us-en
    bingMarket: en-US
    lang: en
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      flashnext-local:
        displayName: flashnext-local
        apiKeyEnv: LLAMACPP_LOCAL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8080/v1
        streamIdleTimeoutMs: 900000
        compat:
          supportsReasoningEffort: true
        models:
          - id: ~/models/Qwen3.8-Flash-Next-GSQ/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
            name: Qwen3.8 Flash-Next
            contextWindow: 65536
            maxTokens: 61440
            input:
              - text
            reasoningEfforts:
              low: low
              medium: medium
              xhigh: xhigh
      llamacpp-local:
        displayName: llamacpp-local
        apiKeyEnv: LLAMACPP_LOCAL_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8091/v1
        streamIdleTimeoutMs: 900000
        compat:
          supportsReasoningEffort: true
        models:
          - id: ~/models/Qwen3.8-27B/Qwen3.8-27B-UD-IQ4_XS.gguf
            name: Qwen 3.8 27B
            contextWindow: 32768
            maxTokens: 28672
            input:
              - text
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              xhigh: xhigh
          - id: ~/models/Qwen3.8-27B-GSQ/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
            name: Qwen 3.8 27B GSQ
            contextWindow: 49152
            maxTokens: 45056
            input: [ text, image ]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              xhigh: xhigh
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: flashnext-local
    model: ~/models/Qwen3.8-Flash-Next-GSQ/IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-IQ3_S-00001-of-00002.gguf
    reasoningEffort: medium
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
