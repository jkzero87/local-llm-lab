<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C. elegans chemotaxis</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0b0f14;
    color: #cfd8e3;
    font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .wrap { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.04em; color: #9fb6cc; }
  canvas {
    background: #000;
    border: 1px solid #223042;
    border-radius: 6px;
    display: block;
    cursor: crosshair;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    align-items: center;
    justify-content: center;
    width: 600px;
    padding: 10px 12px;
    background: #101823;
    border: 1px solid #223042;
    border-radius: 6px;
  }
  button {
    background: #1a2634;
    color: #cfd8e3;
    border: 1px solid #2d405a;
    border-radius: 4px;
    padding: 6px 14px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #223145; }
  label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  input[type=range] { width: 110px; accent-color: #5aa9e6; }
  .readout {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    width: 600px;
    justify-content: center;
    padding: 10px 12px;
    background: #101823;
    border: 1px solid #223042;
    border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .readout b { color: #7cc4ff; font-weight: 600; }
  .hint { color: #5b6b7d; font-size: 12px; margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>C. elegans chemotaxis</h1>
    <canvas id="canvas" width="600" height="400"></canvas>
    <div class="controls">
      <button id="play">Pause</button>
      <button id="reset">Reset</button>
      <label>noise
        <input id="noise" type="range" min="0" max="0.3" step="0.01" value="0">
        <span id="noiseVal">0.00</span>
      </label>
      <label><input id="pirouette" type="checkbox" checked> pirouette</label>
      <label><input id="weathervane" type="checkbox" checked> weathervane</label>
      <label><input id="ablateLeft" type="checkbox"> ablate ASEL</label>
      <label><input id="ablateRight" type="checkbox"> ablate ASER</label>
    </div>
    <div class="readout">
      <span>steps <b id="steps">0</b></span>
      <span>dist <b id="dist">-</b></span>
      <span>conc <b id="conc">-</b></span>
      <span>pirouettes <b id="piros">0</b></span>
    </div>
    <p class="hint">click the canvas to move the source</p>
  </div>
  <script type="module" src="./ui.js"></script>
</body>
</html>
